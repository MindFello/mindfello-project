server.port=8080
spring.application.name=mindfello-auth-service

# -----------------------
# PostgreSQL
# -----------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------
# Keycloak Resource Server
# -----------------------
# It's better to use issuer-uri, as it lets Spring auto-fetch the JWK set
#spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

# If issuer-uri doesn?t work (older Keycloak version), uncomment below:
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

# -----------------------
# CORS (optional fallback)
# -----------------------
# spring.web.cors.allowed-origins=http://localhost:3000
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# -----------------------
# Logging
# -----------------------
logging.level.org.springframework.security=DEBUG
logging.level.org.keycloak=DEBUG
