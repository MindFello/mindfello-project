server {
  listen 80;
  server_name _;

  # Serve built React app
  root /usr/share/nginx/html;
  index index.html;

  # React router fallback
  location / {
    try_files $uri /index.html;
  }

  # Static file caching
  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|svg|eot)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
  }

  # --- Security Headers ---
  add_header X-Frame-Options "DENY";
  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "no-referrer-when-downgrade";
  add_header Cross-Origin-Opener-Policy "same-origin";
  add_header X-XSS-Protection "1; mode=block";

  # --- Optional: Enable gzip compression ---
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;

  # --- Optional: Proxy backend API calls ---
  location /api/ {
    proxy_pass http://auth-backend:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}